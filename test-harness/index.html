<!DOCTYPE html>
<html>
<head>
  <title>CodeMirror Test Harness</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 20px;
      background: #1e1e1e;
      color: #fff;
    }
    #editor {
      border: 1px solid #444;
      height: 400px;
    }
    .cm-editor {
      height: 100%;
    }
    #debug {
      margin-top: 20px;
      padding: 10px;
      background: #2d2d2d;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }
    h1 { font-size: 18px; }
    .controls {
      margin-bottom: 10px;
    }
    button {
      padding: 8px 16px;
      margin-right: 8px;
      cursor: pointer;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "https://esm.sh/@codemirror/state@6",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6"
    }
  }
  </script>
</head>
<body>
  <h1>Transcript Split Test Harness</h1>
  <div class="controls">
    <button onclick="logState()">Log State</button>
    <button onclick="clearDebug()">Clear Debug</button>
  </div>
  <div id="editor"></div>
  <div id="debug"></div>

  <script type="module">
    import { EditorState } from "@codemirror/state";
    import { EditorView, keymap } from "@codemirror/view";
    import { defaultKeymap } from "@codemirror/commands";

    // Import real extensions from our bundle
    import {
      doubleEnterSplitExtension,
      transcriptField,
      alignmentStore
    } from "./bundle.js";

    const debugEl = document.getElementById('debug');

    function debug(msg) {
      const time = new Date().toISOString().split('T')[1].slice(0, 12);
      debugEl.textContent += `[${time}] ${msg}\n`;
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    window.clearDebug = () => { debugEl.textContent = ''; };

    const initialDoc = `# Test Document

:::transcript[test.m4a]{start=0 end=10}
Hello world this is a test transcript with some words.
:::

Some text after.
`;

    const state = EditorState.create({
      doc: initialDoc,
      extensions: [
        transcriptField,
        doubleEnterSplitExtension,
        keymap.of(defaultKeymap),
        EditorView.theme({
          "&": { backgroundColor: "#1e1e1e", color: "#d4d4d4" },
          ".cm-content": { caretColor: "#fff" },
          ".cm-cursor": { borderLeftColor: "#fff" },
        }),
        EditorView.updateListener.of(update => {
          if (update.docChanged) {
            debug("Document changed");
          }
        }),
      ],
    });

    const view = new EditorView({
      state,
      parent: document.getElementById('editor'),
    });

    window.view = view;
    window.alignmentStore = alignmentStore;

    window.logState = () => {
      const field = view.state.field(transcriptField);
      debug(`Directives: ${JSON.stringify(field.directives, null, 2)}`);
    };

    // Add fake alignment for the test content
    const fakeContent = "Hello world this is a test transcript with some words.";
    const fakeAlignment = {
      audioHash: "test123",
      transcriptHash: "test456",
      language: "en",
      tool: "test",
      createdAt: Date.now(),
      text: fakeContent,
      segments: [{
        start: 0,
        end: 5,
        text: fakeContent,
        words: [
          { word: "Hello", start: 0, end: 0.5 },
          { word: "world", start: 0.5, end: 1 },
          { word: "this", start: 1, end: 1.5 },
          { word: "is", start: 1.5, end: 2 },
          { word: "a", start: 2, end: 2.2 },
          { word: "test", start: 2.2, end: 2.8 },
          { word: "transcript", start: 2.8, end: 3.5 },
          { word: "with", start: 3.5, end: 4 },
          { word: "some", start: 4, end: 4.5 },
          { word: "words.", start: 4.5, end: 5 },
        ]
      }]
    };

    alignmentStore.set("test.m4a", fakeContent, fakeAlignment);
    debug('Test harness loaded with REAL extensions.');
    debug(`Alignment stored for: "${fakeContent}"`);
    debug('');
    debug('To test double-enter split:');
    debug('1. Click inside transcript content');
    debug('2. Press Enter to insert a newline');
    debug('3. Press Enter again (at start of new line) to split');
    debug('');
    debug('To test text replacement split:');
    debug('1. Select some words in the transcript');
    debug('2. Type replacement text');
  </script>
</body>
</html>
